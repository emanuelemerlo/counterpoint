# Tests, package and release of the plugin.
#
# - push to a branch or pull request: tests + package downloadable from the
#   run's "artifacts" (no release).
# - push of a tag vX.Y.Z: tests + package + GitHub release with the plugin zip,
#   README.TXT / LEGGIMI.TXT and the notes from CHANGELOG.md and CHANGELOG.it.md.
# - manual run (Actions → Release → Run workflow): as above; with a version it
#   creates the tag and the release on the chosen commit.
#
# The version must match `version:` in contrappunto.qml and have a "## X.Y.Z"
# section in CHANGELOG.md, otherwise the workflow stops.
name: Release

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 2.7.0); empty = test package only"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Engine tests (no parallel fifths/octaves, analysis, locked notes)
        run: node tests/run_tests.js

      - name: Translations (keys, placeholders, untranslated texts)
        run: node tests/check_i18n.js

      - name: Wiki sources (links, images, languages)
        run: python3 tests/check_wiki.py

      - name: System libraries for Qt (offscreen)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon0 libfontconfig1 libglib2.0-0 libdbus-1-3

      - name: QML plugin test with a fake MuseScore
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          pip install -q PySide6-Essentials==6.12.0   # version used to develop the tests
          timeout 120 python3 tests/mock/run_mock.py 2>&1 | tee mock.log
          grep -q "RESULT OK" mock.log
          ! grep -q "RESULT FAIL" mock.log

      - name: Version to publish
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          elif [[ -n "${{ inputs.version }}" ]]; then
            echo "tag=v${{ inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "create_tag=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Package (zip, README.TXT, LEGGIMI.TXT, release notes)
        id: pkg
        run: python3 tools/build_release.py ${{ steps.ver.outputs.tag && format('--expect-version {0}', steps.ver.outputs.tag) || '' }}

      - name: Upload the package as an artifact
        uses: actions/upload-artifact@v6
        with:
          name: Contrappunto-${{ steps.pkg.outputs.version }}
          path: |
            dist/Contrappunto-*.zip
            dist/*.TXT
            dist/release-notes.md

      - name: Publish the release
        if: steps.ver.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
          VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          extra=()
          if [[ "${{ steps.ver.outputs.create_tag }}" == "true" ]]; then extra+=(--target "$GITHUB_SHA"); fi
          if [[ "$VERSION" == *-* ]]; then extra+=(--prerelease); fi
          gh release create "$TAG" \
            "dist/Contrappunto-${VERSION}.zip" dist/*.TXT \
            --title "Contrappunto ${VERSION}" \
            --notes-file dist/release-notes.md \
            "${extra[@]}"
